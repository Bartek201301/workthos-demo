name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and build
        run: |
          if [ -f package.json ]; then
            npm ci && npm test && npm run build
          else
            echo "No app yet"
          fi
